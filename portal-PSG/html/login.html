<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Carreira</title>
    <!-- Fontes -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
   <!-- Cole este link de fontes no <head> de TODAS as páginas -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lekton:wght@400;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
</head> <!-- O HEAD AGORA ESTÁ FECHADO AQUI -->
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="home.html" class="logo">
                <img src="../img/senac-logo.png" alt="Logo SENAC" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="home.html">Início</a></li>
                <li><a href="editais.html">Editais Disponíveis</a></li>
                <li><a href="teste-carreira.html">Teste de Carreira</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li class="login-item">
                    <a href="login.html" class="btn-nav-login">Entrar</a>
                </li>
            </ul>
        </div>
    </header>
<body>
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Acesso ao Portal PSG</h2>
                <p>Faça login para acompanhar sua candidatura</p>
            </div>

            <form action="home.html" method="GET" class="login-form">
                <div class="input-group">
                    <label for="cpf">CPF ou E-mail</label>
                    <input type="text" id="cpf" name="cpf" required placeholder="Digite seu CPF ou e-mail">
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha secreta">
                </div>

                <div class="input-group">
                    <a href="#" class="forgot-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            
            <div class="login-footer">
                <p>Ainda não tem cadastro? <a href="inscricao.html">Crie sua conta</a></p>
                <hr style="margin: 16px 0; opacity: 0.3;">
                <p style="font-size: 12px; text-align: center;">
                    <a href="../admin/login.html" style="color: #0A1AEB; text-decoration: underline;">Acesso Administrativo</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
