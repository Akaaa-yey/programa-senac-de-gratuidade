            <h2>Acesso ao Portal PSG</h2>
            <p>Faça login para acompanhar sua candidatura</p>
            
            <form action="/portal-PSG/html/index.html" method="GET">
                <div class="input-group">
                    <label for="cpf">CPF ou E-mail</label>
                    <input type="text" id="cpf" name="cpf" required placeholder="Digite seu CPF ou e-mail">

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="Sua senha secreta">
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            
            <div class="divider">ou</div>
            
            <button class="btn-secondary">Acesso por Código (SMS)</button>
