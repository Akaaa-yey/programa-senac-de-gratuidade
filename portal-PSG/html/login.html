<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Portal PSG</title>
    <!-- Fontes e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lekton:wght@400;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="home.html" class="logo">
                <img src="../img/senac-logo.png" alt="Logo SENAC" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="home.html">Início</a></li>
                <li><a href="editais.html">Editais Disponíveis</a></li>
                <li><a href="teste-carreira.html">Teste de Carreira</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li class="login-item">
                    <a href="login.html" class="btn-nav-login">Entrar</a>
                </li>
            </ul>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Acesso ao Portal PSG</h2>
                <p>Faça login para acompanhar sua candidatura</p>
            </div>

            <!-- Formulário com ID correto e sem action/method para não disparar GET -->
            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail ou CPF</label>
                    <input type="text" id="email" name="email" required placeholder="Digite seu e-mail ou CPF">
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Sua senha secreta">
                </div>

                <div class="input-group">
                    <a href="#" class="forgot-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            
            <div class="login-footer">
                <p>Ainda não tem cadastro? <a href="inscricao.html">Crie sua conta</a></p>
                <hr style="margin: 16px 0; opacity: 0.3;">
                <p style="font-size: 12px; text-align: center;">
                    <!-- Caminho relativo direto para a subpasta admin -->
                    <a href="admin/login.html" style="color: #0A1AEB; text-decoration: underline;">Acesso Administrativo</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Importação do arquivo de autenticação -->
    <script src="../js/auth.js"></script>
</body>
</html>
