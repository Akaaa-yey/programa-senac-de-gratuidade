<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua Conta - Portal PSG SENAC PE</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/incricao.css">
     <!-- Cole este link de fontes no <head> de TODAS as páginas -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lekton:wght@400;700&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO (NAVBAR) -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="home.html" class="logo">
                <img src="../img/senac-logo.png" alt="Logo SENAC" class="logo-img">
            </a>

            <ul class="nav-links">
                <li><a href="home.html">Início</a></li>
                <li><a href="editais.html">Editais Disponíveis</a></li>
                <li><a href="teste-carreira.html">Teste de Carreira</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li class="login-item">
                    <a href="login.html" class="btn-nav-login">Entrar</a>
                </li>
            </ul>
        </div>
    </header>

    <!-- CONTAINER DA TELA DE CADASTRO -->
    <main class="register-wrapper">
        <div class="register-card">
            <div class="register-header">
                <h2>Crie sua Conta no PSG</h2>
                <p>Preencha seus dados para se candidatar aos cursos gratuitos do SENAC Pernambuco</p>
            </div>

            <form action="login.html" method="POST" class="register-form">
                <div class="form-grid">
                    <!-- Nome Completo (Linha Inteira) -->
                    <div class="input-group full-width">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <!-- CPF -->
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <!-- Data de Nascimento -->
                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>

                    <!-- E-mail -->
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                    </div>

                    <!-- Telefone -->
                    <div class="input-group">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(81) 90000-0000" required>
                    </div>

                    <!-- Senha -->
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" required>
                    </div>

                    <!-- Confirmar Senha -->
                    <div class="input-group">
                        <label for="confirma-senha">Confirmar Senha</label>
                        <input type="password" id="confirma-senha" name="confirma-senha" placeholder="Repita a senha" required>
                    </div>
                </div>

                <!-- DECLARAÇÕES E TERMOS (PSG) -->
                <div class="checkbox-group">
                    <label class="checkbox-container">
                        <input type="checkbox" name="renda" required>
                        <span>Declaro ter renda familiar per capita de até 2 salários mínimos (Requisito PSG).</span>
                    </label>

                    <label class="checkbox-container">
                        <input type="checkbox" name="termos" required>
                        <span>Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>.</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Cadastrar Minha Conta</button>
            </form>

            <div class="register-footer">
                <p>Já possui uma conta? <a href="login.html">Faça login aqui</a></p>
                <hr style="margin: 12px 0; opacity: 0.2;">
                <p style="font-size: 12px;">
                    <a href="../admin/login.html" style="color: #0A1AEB; text-decoration: underline;">Acesso Administrativo</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
